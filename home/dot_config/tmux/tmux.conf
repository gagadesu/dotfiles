# General

## reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf
## change the prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
## start with window 1 instead of 0
set -g base-index 1
## start with pane 1 instead of 0
set -g pane-base-index 1
## shorten command delay
set -sg escape-time 1
## split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
## open new windows in the current path
bind c new-window -c "#{pane_current_path}"
## move between windows
bind p previous-window
## auto-rename off
set -g allow-rename off
set -g automatic-rename off
## mouse control
set -g mouse on
## use Alt+arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
## use Shift+arrow keys to adjust pane size
bind -n S-Left resize-pane -L 3
bind -n S-Right resize-pane -R 3
bind -n S-Up resize-pane -U 1
bind -n S-Down resize-pane -D 1
## enable vi mode keys
set-window-option -g mode-keys vi
## set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
## present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"
## move status position to top
set-option -g status-position top
bind C-l send-keys C-l

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin v2: configure options before loading the theme.
set -g @catppuccin_flavor "mocha"
# Preserve the terminal's default background (old versions called this "default").
set -g @catppuccin_status_background "none"

set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_right_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_number_position "left"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_border_style "fg=#{@thm_sky}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"
set -g @catppuccin_pane_color "#{@thm_sky}"
set -g @catppuccin_pane_background_color "#{@thm_sky}"

set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰖯"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"

# Preserve rounded custom separators and place window numbers on the right.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]"
set -g @catppuccin_window_right_separator "#[fg=#{@thm_blue},bg=default] "
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_blue},bg=#{@thm_surface_0}] █"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_bg},bg=default]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_peach},bg=default] "
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_peach},bg=#{@thm_bg}] █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_module_text_bg "#{@thm_surface_0}"
set -g @catppuccin_directory_text " #{pane_current_path}"
set -g @catppuccin_directory_color "#{@thm_blue}"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_date_time_color "#{@thm_pink}"

# Status modules must be composed after loading Catppuccin.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
set -gw pane-border-status off
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

# Initialize TPM last so other plugins can augment the status line.
run '~/.config/tmux/plugins/tpm/tpm'
